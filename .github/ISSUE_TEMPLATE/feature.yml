name: Feature request
description: Idea for these examples or self-serve developer DX on the hosted API
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Scope: **self-serve developers** and OpenAI-compatible usage.
        This examples repo does not imply a full Org/admin console is delivered.
  - type: textarea
    id: scenario
    attributes:
      label: Scenario (self-serve developer)
      description: Who benefits and what they are trying to do
    validations:
      required: true
  - type: dropdown
    id: openai_compat
    attributes:
      label: Related to OpenAI SDK / OpenAI-compatible API?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals (optional)
      description: What this request is not asking for
